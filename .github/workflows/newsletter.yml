name: Daily Meditations

# Generates TOMORROW's edition each evening, so Gio can review, build, and
# schedule it in Beehiiv the night before (a calm, regular time) and let Beehiiv
# send it the next morning. EDITION_LEAD_DAYS=1 makes the generator date the
# edition for the next day (computed in Pacific time). Each run:
#   1. writes a structured record to content/editions/<tomorrow>.json
#   2. emails the rendered draft to Gio as the review prompt (Beehiiv send API is
#      Enterprise-only, so email is the delivery; you edit + schedule in Beehiiv)
#   3. rebuilds the public archive at /meditations and commits it, so the edition
#      auto-publishes to getmarcus.app (Vercel redeploys on push). Veto an edition
#      by deleting its content/editions/<date>.json and letting the next build run.
#
# 22:23 UTC is ~3:23pm Pacific (PDT) / ~2:23pm (PST) — mid-afternoon the day
# before, so the draft lands with plenty of daylight to review and schedule (the
# old 03:00 UTC slot drifted to ~11pm because on-the-hour crons are the most
# oversubscribed / delayed on GitHub Actions; an odd minute dodges that queue).
# Cron is UTC and does not shift with daylight saving, so local time moves ±1h
# across the year; the edition DATE stays correct regardless because the
# generator computes it in Pacific time with the 1-day lead.

on:
  schedule:
    - cron: '23 22 * * *'  # 22:23 UTC ≈ 3:23pm PDT / 2:23pm PST — early enough to
                           # land by ~5pm PT even with GitHub's queue delay, and
                           # off the top of the hour to dodge the worst of it.
  workflow_dispatch: {}       # manual run from the Actions tab

permissions:
  contents: write             # the archive commit pushes back to main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci || npm install

      - name: Generate edition
        working-directory: scripts
        env:
          ANTHROPIC_KEY: ${{ secrets.NEWSLETTER_ANTHROPIC_KEY }}
          BEEHIIV_KEY: ${{ secrets.BEEHIIV_KEY }}
          BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EDITION_LEAD_DAYS: '1'   # generate tomorrow's edition, the evening before
        run: node generate-newsletter.js

      - name: Build archive
        working-directory: scripts
        run: node build-archive.js

      - name: Publish archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/editions public/meditations
          if git diff --cached --quiet; then
            echo "No archive changes to publish."
          else
            git commit -m "Daily Meditations: publish $(date -u +%Y-%m-%d) edition"
            git push origin HEAD:main
          fi

      # If Beehiiv staging failed, the generator writes the HTML to
      # scripts/out/. Capture it so a produced-but-unstaged edition is never
      # lost — download it from the run and paste into Beehiiv by hand.
      - name: Save edition on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-edition
          path: scripts/out/
          if-no-files-found: ignore
          retention-days: 14
